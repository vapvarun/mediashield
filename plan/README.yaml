# Note: existing flat files (DESIGN_SPEC*.md, IMPLEMENTATION_PLAN*.md,
# RELEASE_FIX_PLAN.md, 1.1.0-player-config-filter.md) are listed here
# as `dated` even though they aren't yet inside YYYY-MM-DD-<slug>/
# folders — moving them is a follow-up. The U5 check just needs them
# indexed; the folder convention is a normalization for the next pass.
# ──────────────────────────────────────────────────────────────────────

