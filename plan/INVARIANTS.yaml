# ──────────────────────────────────────────────────────────────────────
# Baseline — pre-existing violations recorded here as warnings, not
# errors. Every entry needs an `eta` (target fix date) so the baseline
# shrinks over time.
#
# Rule: if you add to the baseline, also document in plan/FOLLOWUPS.md
# so the debt is visible at the plan level too.
# ──────────────────────────────────────────────────────────────────────

baseline:

  - gate: U1
    path: "includes/REST/AnalyticsController.php"
    reason: "Analytics aggregations were originally co-located in the controller. Refactor target: extract into includes/Analytics/AnalyticsRepository.php so the controller becomes a thin formatter."
    eta: v1.2
    added: 2026-05-11
    surfaced_by: "wp-plugin-onboard refresh 2026-05-11 (Phase 4.7.2.5 first-run gate)"

  - gate: U1
    path: "includes/REST/PlaylistController.php"
    reason: "Playlist item CRUD is co-located in the controller. Refactor target: includes/Playlist/PlaylistRepository.php (mirroring existing TagManager pattern)."
    eta: v1.2
    added: 2026-05-11
    surfaced_by: "wp-plugin-onboard refresh 2026-05-11 (Phase 4.7.2.5 first-run gate)"

  - gate: U1
    path: "includes/Player/PlaylistRenderer.php"
    reason: "Renderer fetches playlist items inline for efficiency. Renderer SHOULD ask PlaylistRepository::get_items($id) instead — same refactor target as PlaylistController."
    eta: v1.2
    added: 2026-05-11
    surfaced_by: "wp-plugin-onboard refresh 2026-05-11 (Phase 4.7.2.5 first-run gate)"
